name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # El nombre `test` no se renombra: la protección de main exige ese check, y
  # cambiarlo bloquea todos los PR sin un mensaje que explique por qué.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # El build vive en server/. Aplica a los `run`, no a los `uses`: la
        # caché de Gradle de setup-java busca los *.gradle* en todo el workspace.
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew test

  # El trabajo de la app. Corre siempre, igual que `test` y sin filtros de
  # ruta: con filtros, un check obligatorio que no corre deja el PR esperando
  # para siempre. No compila para Android ni para iOS —eso pide un SDK nativo
  # y, en iOS, un Mac—: corre el analizador y los tests, que no dependen de
  # ninguna plataforma.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Fijada: con `channel: stable` a secas, el día que Flutter saque una
          # versión el build cambia sin que nadie toque el repo, y un fallo así
          # se busca primero en el código.
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      # --fatal-infos: las reglas de analysis_options.yaml avisan en infos. Sin
      # esto, `flutter analyze` pasa en verde con los avisos puestos.
      - run: flutter analyze --fatal-infos
      - run: flutter test
