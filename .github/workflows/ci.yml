name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # El nombre `test` no se renombra: la protección de main exige ese check, y
  # cambiarlo bloquea todos los PR sin un mensaje que explique por qué.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # El build vive en server/. Aplica a los `run`, no a los `uses`: la
        # caché de Gradle de setup-java busca los *.gradle* en todo el workspace.
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew test
      # El contrato que lee mobile/. ContractTest ya pone rojo el build si
      # contract/openapi.json no coincide con el código (y lo reescribe); este
      # paso es la segunda red, y la que dice qué hacer. Corre aunque el test
      # haya fallado, que es justo cuando hace falta el mensaje.
      - name: El contrato está comiteado
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain -- ../contract)" ]; then
            git diff --stat -- ../contract
            echo "::error::contract/openapi.json no corresponde al código: corre ./gradlew test en server/ y commitea el contrato"
            exit 1
          fi

  # El trabajo de la app. Corre siempre, igual que `test` y sin filtros de
  # ruta: con filtros, un check obligatorio que no corre deja el PR esperando
  # para siempre. No compila para Android ni para iOS —eso pide un SDK nativo
  # y, en iOS, un Mac—: corre el analizador y los tests, que no dependen de
  # ninguna plataforma.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Fijada: con `channel: stable` a secas, el día que Flutter saque una
          # versión el build cambia sin que nadie toque el repo, y un fallo así
          # se busca primero en el código.
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      # El cliente de lib/data/api/ se genera desde contract/openapi.json y no
      # se edita a mano. Aquí se regenera con el mismo script que usa una
      # persona, y si sale distinto de lo comiteado, el PR no pasa: o cambió el
      # contrato sin regenerar el cliente, o alguien tocó lo generado.
      - name: El cliente generado corresponde al contrato
        run: |
          ./tool/generate_api.sh
          if [ -n "$(git status --porcelain -- lib/data/api)" ]; then
            git status --short -- lib/data/api
            echo "::error::lib/data/api no corresponde a contract/openapi.json: corre mobile/tool/generate_api.sh y commitea el resultado"
            exit 1
          fi
      # --fatal-infos: las reglas de analysis_options.yaml avisan en infos. Sin
      # esto, `flutter analyze` pasa en verde con los avisos puestos.
      - run: flutter analyze --fatal-infos
      - run: flutter test

  # La imagen y el despliegue (deploy/). Corre siempre, como los otros dos.
  # El orden importa: los tests que necesitan la imagen en el Docker local van
  # antes de setup-buildx, porque desde ahí `docker build` pasa al constructor
  # en contenedor y deja de cargar las imágenes donde `docker run` las busca.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Los scripts de deploy/ se ejecutan con secretos en el entorno: un
      # error de comillas en uno de ellos es un secreto partido en dos.
      - run: shellcheck -x deploy/*.sh deploy/postgres/*.sh deploy/test/*.sh
      - run: deploy/test/compose.test.sh
      - run: deploy/test/generate-secrets.test.sh
      - run: deploy/test/image.test.sh

      # El compose de verdad, con secretos generados en el momento: levanta,
      # pasa la prueba de humo y comprueba que Postgres no quedó publicado.
      - name: El compose levanta y pasa la prueba de humo
        working-directory: deploy
        run: |
          ./generate-secrets.sh
          docker compose up -d --build --wait
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/balances || true)
            [ "$code" = 401 ] && break
            sleep 2
          done
          token=$(grep '^API_TOKEN=' .env | cut -d= -f2-)
          echo "::add-mask::$token"
          printf '%s\n%s\nsi\n' http://127.0.0.1:8080 "$token" | ./smoke-test.sh
          bindings=$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$(docker compose ps -q db)")
          [ "$bindings" = "{}" ] || { echo "db publica puertos: $bindings"; exit 1; }
          if (exec 3<> /dev/tcp/127.0.0.1/5432) 2> /dev/null; then
            echo "algo responde en 127.0.0.1:5432"; exit 1
          fi
      - name: Apagar el compose
        if: always()
        working-directory: deploy
        run: docker compose down -v || true

      # Ampere (Oracle) es arm64: una imagen construida solo en x86 no arranca
      # allá. Se construyen las dos, sin publicar nada, y la de arm64 se
      # arranca bajo QEMU para saber que su JVM corre, no solo que se armó.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Imagen para linux/amd64 y linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Cargar la de arm64
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/arm64
          load: true
          tags: finance-api:arm64
          cache-from: type=gha
      - run: docker run --rm --platform linux/arm64 --entrypoint java finance-api:arm64 -version
