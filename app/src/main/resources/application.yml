spring:
  application:
    name: FinanceApp

  # En los tests la conexión la inyecta Testcontainers con @ServiceConnection.
  # En el servidor viene de variables de entorno, que es lo que leerá el
  # docker compose de Oracle sin tener que tocar este archivo.
  #
  # Sin valores por defecto, a propósito. Con un "${DB_PASSWORD:finance}", un
  # servidor al que le faltara la variable arrancaría con una clave que está
  # publicada en este repositorio. Así, si falta, la aplicación no conecta y no
  # arranca, que es lo que debe pasar.
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    # Flyway es el dueño del esquema. Hibernate solo verifica que lo que
    # encuentra coincide con lo que espera, y falla el arranque si no.
    # Nunca 'update': generaría tablas sin los triggers ni los índices parciales.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # El esquema tiene triggers y una vista; una migración fuera de orden
    # dejaría la base en un estado que nadie sabría reproducir.
    validate-on-migrate: true

logging:
  level:
    org.flywaydb: INFO
