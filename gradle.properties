# UTF-8 explícito en toda la cadena.
#
# El código y el SQL tienen acentos ("Alimentación", "Mamá", los mensajes de los
# triggers). Java 21 ya lee las fuentes como UTF-8 por omisión, pero fijarlo
# aquí evita que el build dependa de la configuración regional de la máquina:
# tu Windows y el runner Linux de GitHub Actions tienen que compilar igual.
org.gradle.jvmargs=-Dfile.encoding=UTF-8
systemProp.file.encoding=UTF-8

# Un solo usuario, un solo desarrollador: el demonio en caliente ahorra
# segundos en cada corrida de los tests de dominio.
org.gradle.daemon=true
org.gradle.parallel=true
